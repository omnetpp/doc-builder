# Builds the sample model in site/, the website of this repository, with the action of this repository, in
# each of its modes. Also runs weekly, to notice when a new doc-builder image breaks it.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  ned-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          project-dir: site
          title: Sample Model
          doxygen: true
          fail-on-warnings: true
          upload-pages-artifact: false
      - name: Check the site
        run: |
          test -f _site/index.html
          test -f _site/api/classsample_1_1Source.html
          grep -q 'href="api/classsample_1_1Source.html"' _site/sample.Source.html

  sphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: docs
        uses: ./
        with:
          project-dir: site
          title: Sample Model
          sphinx-source: site/doc
          doxygen: true
          fail-on-warnings: true
      - name: Check the site
        env:
          SITE: ${{ steps.docs.outputs.site-dir }}
        run: |
          test -f "$SITE/index.html"
          test -f "$SITE/ned/types/sample.Source.html"
          test -f "$SITE/api/classsample_1_1Source.html"
          grep -q 'href="../../api/classsample_1_1Source.html"' "$SITE/ned/types/sample.Source.html"
          grep -q 'api/classsample_1_1Source.html' "$SITE/config/writing.html"
          grep -q 'ned/types/sample.Source.html' "$SITE/config/writing.html"

  # The pages alone, without the NED reference and the C++ API
  sphinx-without-ned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          project-dir: site
          title: Sample Model
          sphinx-source: site/doc
          ned: false
          upload-pages-artifact: false
      - name: Check the site
        run: |
          test -f _site/index.html
          test -f _site/config/writing.html
          test ! -e _site/ned
          test ! -e _site/api

  sphinx-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          project-dir: site
          title: Sample Model
          sphinx-source: site/doc
          doxygen: true
          pdf: true
          upload-pages-artifact: false
      - name: Check the site
        run: |
          test -f _site/index.html
          test -f _site/doc-builder.pdf
