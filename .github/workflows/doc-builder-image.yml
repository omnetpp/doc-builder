# Builds and publishes the doc-builder container image. Doing it here rather than
# from a workstation means the published image is reproducible, is automatically
# linked to this repository, and needs no personal access token.
#
# Runs on:
#   - a push to v1 that changes the image (image/, extensions/, this file): the
#     action at v1 and the documentation builds that pull :latest run in it.
#     Other pushes leave the toolchain under every build as it is.
#   - a push of a release tag vX.Y.Z, whatever it changes: the action of that
#     release runs in :vX.Y.Z.
#   - a manual run from the Actions tab, e.g. for the updates of the Ubuntu packages.
#
# Each run publishes the names of its ref:
#   :<branch>         - for a branch, e.g. :v1, which omnetpp/doc-builder@v1 runs
#                       in; :latest as well for the default branch (v1)
#   :vX.Y.Z           - for a release tag
name: Build doc-builder image

on:
  push:
    branches: [v1]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    # Not evaluated for tag pushes
    paths:
      - 'image/**'
      - 'extensions/**'
      - '.github/workflows/doc-builder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Per ref: a release pushes v1 and its tag together, and a run pending in the same
# group as another one would be cancelled by a third.
concurrency:
  group: doc-builder-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tags
        id: tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          {
            echo 'list<<EOF'
            # A branch name may have slashes, which an image tag may not
            echo "ghcr.io/omnetpp/doc-builder:${GITHUB_REF_NAME//\//-}"
            if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              echo "ghcr.io/omnetpp/doc-builder:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Links the GHCR package to this repository.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # No build cache on purpose: this image is rebuilt only when it
          # changes, and a mode=max export would crowd the repository's
          # shared 10 GB Actions cache. Requires no buildx driver setup either.
