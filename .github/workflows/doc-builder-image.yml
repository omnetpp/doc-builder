# Builds and publishes the doc-builder container image. Doing it here rather than
# from a workstation means the published image is reproducible, is automatically
# linked to this repository, and needs no personal access token.
#
# Currently DISABLED (fails in its first step): the image bundles a locally built
# opp-tools tarball, so it is published from a workstation with image/build.sh --push.
#
# Manual only: run it from the Actions tab after changing the image (image/,
# extensions/). Republishing the image changes the toolchain under every
# subsequent documentation build, so it is a deliberate act rather than a side
# effect of pushing.
#
# Every build publishes these references:
#   :latest           - what the documentation builds pull by default
#   :<branch>         - the branch it is run on, e.g. :v1, which
#                       omnetpp/doc-builder@v1 runs in
#   :vX.Y.Z           - for a release tag on the commit; the action of
#                       that release runs in it
name: Build doc-builder image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: doc-builder-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The image bundles @omnetpp/opp-tools, which is not on npm yet and comes from
      # a local build of the omnetpp-vscode repo that this checkout does not have.
      # Remove this step once the Containerfile fetches a published version.
      - name: Unavailable until opp-tools is published
        run: |
          echo "::error::The doc-builder image needs a locally built opp-tools tarball. Publish it from a workstation with image/build.sh --push"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "ghcr.io/omnetpp/doc-builder:latest"
            if [ "$GITHUB_REF_TYPE" = branch ]; then
              echo "ghcr.io/omnetpp/doc-builder:${GITHUB_REF_NAME//\//-}"
            fi
            for tag in $(git tag --points-at HEAD 'v[0-9]*'); do
              echo "ghcr.io/omnetpp/doc-builder:$tag"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Links the GHCR package to this repository.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # No build cache on purpose: this image is rebuilt only when the
          # toolchain changes, and a mode=max export would crowd the repository's
          # shared 10 GB Actions cache. Requires no buildx driver setup either.
